name: Appli Android

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appli:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COURRIER_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compilation de l'appli et de son test
        run: gradle -p android assembleDebug assembleDebugAndroidTest

      - name: Accès à la virtualisation pour l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Parcours complet dans l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/e2e.sh

      - name: Captures d'écran et journaux
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash android/ci/publish-captures.sh

      - name: APK signé
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: bash android/ci/release.sh
